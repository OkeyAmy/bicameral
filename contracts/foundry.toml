[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"   # Somnia's EVM baseline

# initialize() carries a lot of config, which overflows the legacy pipeline's
# stack. via_ir + the optimizer also matters here for a second reason: Somnia
# prices state-creation and deploys aggressively (see the template's SKILL.md),
# and every agent is a clone of this implementation.
via_ir = true
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
somnia_testnet = "https://dream-rpc.somnia.network"
